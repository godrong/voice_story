[project]
name = "voice-story"
version = "0.0.1"
description = "Personalized voice cloning + long-form storytelling system"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "voice-story" }]
license = { text = "MIT" }

dependencies = [
    # Core audio
    "ffmpeg-python>=0.2.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "numpy>=1.26,<2.0",
    "torch>=2.2",
    "torchaudio>=2.2",

    # CLI / orchestration
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",

    # Source plugins
    "kagglehub>=0.3",
]

[project.optional-dependencies]
preprocess = [
    "demucs>=4.0.1",
    "silero-vad>=5.0",
    "pyloudnorm>=0.1.1",
    "pypinyin>=0.50",
    "pronouncing>=0.2.0",
    "onnxruntime>=1.17",
]
asr = [
    "faster-whisper>=1.0",
    "funasr>=1.1",
    "modelscope>=1.17",
]
tts = [
    # CosyVoice is installed from source; pinned via uv sources below
]
adk = [
    "google-adk>=0.1",
    "litellm>=1.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "core"]

[project.scripts]
voice-story = "cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
